name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Мій Браузер"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project.zip
        run: |
          test -f project.zip || { echo "ПОМИЛКА: у корені репозиторію немає project.zip"; exit 1; }
          unzip -o project.zip
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s|Мій Браузер|$APP_NAME|" app/src/main/AndroidManifest.xml
          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            sed -i 's|@android:drawable/sym_def_app_icon|@mipmap/ic_launcher|' app/src/main/AndroidManifest.xml
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
